name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'JSON string of video source files'
        required: true
      entry_file:
        description: 'Entry file'
        default: './src/Video.tsx'
      composition_id:
        description: 'Composition ID'
        # FIX 1: matches DEFAULT_META.compositionId in utils.ts
        default: 'Main'
      duration_in_frames:
        description: 'Duration in frames'
        default: '150'
      props:
        description: 'JSON string of input props for the composition'
        default: '{}'
      callback_url:
        description: 'MCP server callback URL'
        required: true
      session_id:
        description: 'Session ID'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # FIX 2: single install — @remotion/cli and @remotion/renderer
      # are now in package.json, so one "npm install" is enough.
      - name: Install Dependencies
        run: npm install

      - name: Write video source files
        run: node scripts/write-video-files.mjs
        env:
          VIDEO_FILES: ${{ github.event.inputs.files }}

      - name: Make output directory
        run: mkdir -p out

      - name: Write props file
        # FIX 3: persist inputProps/defaultProps so the render matches the preview
        run: echo '${{ github.event.inputs.props }}' > input-props.json

      # 🔧 FIX: Added validation and properly quoted variables to prevent "No entry point" error
      - name: Verify entry file exists
        run: |
          ENTRY="${{ github.event.inputs.entry_file }}"
          echo "🔍 Checking entry file: $ENTRY"
          if [ ! -f "$ENTRY" ]; then
            echo "❌ Entry file not found: $ENTRY"
            echo "📁 Files in repo:"
            find . -name "*.tsx" -o -name "*.ts" | head -20
            exit 1
          fi
          echo "✅ Entry file found"

      - name: Render MP4
        env:
          ENTRY_FILE: ${{ github.event.inputs.entry_file }}
          COMPOSITION_ID: ${{ github.event.inputs.composition_id }}
          PROPS_PATH: "./input-props.json"
        run: |
          echo "🎬 Starting Remotion render..."
          echo "   Entry: $ENTRY_FILE"
          echo "   Composition: $COMPOSITION_ID"
          echo "   Props: $PROPS_PATH"
          
          npx remotion render \
            "$ENTRY_FILE" \
            "$COMPOSITION_ID" \
            out/video.mp4 \
            --props="$PROPS_PATH"
        # FIX 4: removed --fps (not a valid CLI flag; FPS lives in <Composition>)
        # FIX 5: removed --frames (duration lives in <Composition durationInFrames>)
        # FIX 6: removed --browser-executable (ubuntu-latest auto-detects Chrome)
        # FIX 7: quoted all variable expansions to prevent shell parsing issues

      - name: Upload to transfer.sh and callback
        run: |
          echo "📤 Uploading video to transfer.sh..."
          URL=$(curl -s --upload-file out/video.mp4 https://transfer.sh/video.mp4)
          echo "✅ Upload complete: $URL"
          
          echo "🔔 Sending callback to: ${{ github.event.inputs.callback_url }}"
          curl -s -X POST "${{ github.event.inputs.callback_url }}/render-complete" \
            -H "Content-Type: application/json" \
            -d "{\"session_id\": \"${{ github.event.inputs.session_id }}\", \"url\": \"$URL\"}"
          
          echo "✅ Callback sent successfully"
