name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'JSON string of video source files'
        required: true
      entry_file:
        description: 'Entry file'
        default: '/src/Video.tsx'
      composition_id:
        description: 'Composition ID'
        default: 'Main'
      duration_in_frames:
        description: 'Duration in frames'
        default: '150'
      fps:
        description: 'Frames per second'
        default: '30'
      width:
        description: 'Video width'
        default: '1920'
      height:
        description: 'Video height'
        default: '1080'
      props:
        description: 'JSON string of input props for the composition'
        default: '{}'
      callback_url:
        description: 'MCP server callback URL'
        required: true
      session_id:
        description: 'Session ID'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Write video source files
        run: node scripts/write-video-files.mjs
        env:
          VIDEO_FILES: ${{ github.event.inputs.files }}

      - name: Make output directory
        run: mkdir -p out

      - name: Write props file
        run: echo '${{ github.event.inputs.props }}' > input-props.json

      - name: Create registerRoot wrapper
        run: |
          ENTRY_FILE="${{ github.event.inputs.entry_file }}"
          ENTRY_RELATIVE="${ENTRY_FILE#/}"

          echo "📝 Original entry file: $ENTRY_FILE"
          echo "📝 Relative path: $ENTRY_RELATIVE"

          if [[ "$ENTRY_RELATIVE" == "src/Video.tsx" ]]; then
            echo "🔧 Creating src/index.tsx with registerRoot wrapper..."
            mkdir -p src
            cat > src/index.tsx << WRAPPER
          import { registerRoot, Composition } from 'remotion';
          import { Video } from './Video';

          function Root() {
            return (
              <Composition
                id="${{ github.event.inputs.composition_id }}"
                component={Video}
                durationInFrames={${{ github.event.inputs.duration_in_frames }}}
                fps={${{ github.event.inputs.fps }}}
                width={${{ github.event.inputs.width }}}
                height={${{ github.event.inputs.height }}}
              />
            );
          }

          registerRoot(Root);
          WRAPPER
            echo "✅ Created src/index.tsx with registerRoot"
          else
            echo "✅ Using provided entry file: $ENTRY_RELATIVE"
          fi

      - name: Verify entry file exists
        run: |
          ENTRY_FILE="${{ github.event.inputs.entry_file }}"
          ENTRY_RELATIVE="${ENTRY_FILE#/}"

          if [[ "$ENTRY_RELATIVE" == "src/Video.tsx" ]]; then
            ENTRY_RELATIVE="src/index.tsx"
          fi

          echo "🔍 Checking entry file: $ENTRY_RELATIVE"

          if [ ! -f "$ENTRY_RELATIVE" ]; then
            echo "❌ Entry file not found: $ENTRY_RELATIVE"
            echo "📁 Available files:"
            find src -name "*.tsx" -o -name "*.ts" 2>/dev/null | head -10
            exit 1
          fi
          echo "✅ Entry file found: $ENTRY_RELATIVE"

          echo "ENTRY_FINAL=$ENTRY_RELATIVE" >> $GITHUB_ENV

      - name: Render MP4
        env:
          COMPOSITION_ID: ${{ github.event.inputs.composition_id }}
          PROPS_PATH: "./input-props.json"
        run: |
          echo "🎬 Starting Remotion render..."
          echo "   Entry: $ENTRY_FINAL"
          echo "   Composition: $COMPOSITION_ID"
          echo "   Props: $PROPS_PATH"

          npx remotion render \
            "$ENTRY_FINAL" \
            "$COMPOSITION_ID" \
            out/video.mp4 \
            --props="$PROPS_PATH"

      - name: Upload to transfer.sh and callback
        run: |
          echo "📤 Uploading video to transfer.sh..."
          URL=$(curl -s --upload-file out/video.mp4 https://transfer.sh/video.mp4)
          echo "✅ Upload complete: $URL"

          echo "🔔 Sending callback to: ${{ github.event.inputs.callback_url }}"
          curl -s -X POST "${{ github.event.inputs.callback_url }}/render-complete" \
            -H "Content-Type: application/json" \
            -d "{\"session_id\": \"${{ github.event.inputs.session_id }}\", \"url\": \"$URL\"}"

          echo "✅ Callback sent successfully"
