name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'JSON string of video source files'
        required: true
      entry_file:
        description: 'Entry file'
        default: 'src/Video.tsx'
      composition_id:
        description: 'Composition ID'
        # FIX 1: matches DEFAULT_META.compositionId in utils.ts
        default: 'Main'
      duration_in_frames:
        description: 'Duration in frames'
        default: '150'
      props:
        description: 'JSON string of input props for the composition'
        default: '{}'
      callback_url:
        description: 'MCP server callback URL'
        required: true
      session_id:
        description: 'Session ID'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # FIX 2: single install — @remotion/cli and @remotion/renderer
      # are now in package.json, so one "npm install" is enough.
      - name: Install Dependencies
        run: npm install

      - name: Write video source files
        run: node scripts/write-video-files.mjs
        env:
          VIDEO_FILES: ${{ github.event.inputs.files }}

      - name: Make output directory
        run: mkdir -p out

      - name: Write props file
        # FIX 3: persist inputProps/defaultProps so the render matches the preview
        run: echo '${{ github.event.inputs.props }}' > input-props.json

      - name: Render MP4
        run: |
          npx remotion render \
            ${{ github.event.inputs.entry_file }} \
            ${{ github.event.inputs.composition_id }} \
            out/video.mp4 \
            --props="./input-props.json"
        # FIX 4: removed --fps (not a valid CLI flag; FPS lives in <Composition>)
        # FIX 5: removed --frames (duration lives in <Composition durationInFrames>)
        # FIX 6: removed --browser-executable (ubuntu-latest auto-detects Chrome)

      - name: Upload to transfer.sh and callback
        run: |
          URL=$(curl -s --upload-file out/video.mp4 https://transfer.sh/video.mp4)
          curl -s -X POST "${{ github.event.inputs.callback_url }}/render-complete" \
            -H "Content-Type: application/json" \
            -d "{\"session_id\": \"${{ github.event.inputs.session_id }}\", \"url\": \"$URL\"}"
