name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Persistent project ID"
        required: true
        type: string

      project_data:
        description: "Serialized Remotion project"
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create temp directories
        run: |
          mkdir -p temp
          mkdir -p renders

      - name: Write project payload
        run: |
          cat <<'EOF' > temp/project.json
          ${{ github.event.inputs.project_data }}
          EOF

      - name: Verify project payload
        run: |
          echo "Project payload created"
          ls -la temp
          cat temp/project.json | head -20

      - name: Generate Remotion entry
        run: |
          node scripts/generate-project.js

      - name: Build Remotion bundle
        run: |
          npx remotion bundle src/index.tsx

      - name: Render MP4
        run: |
          npx remotion render \
            src/index.tsx \
            Main \
            renders/${{ github.event.inputs.project_id }}.mp4

      - name: Verify rendered video
        run: |
          ls -lah renders

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: remotion-render
          path: renders/${{ github.event.inputs.project_id }}.mp4

      - name: Generate fake public URL
        id: public_url
        run: |
          echo "url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Notify callback endpoint
        env:
          CALLBACK_URL: ${{ secrets.RENDER_CALLBACK_URL }}
        run: |
          curl -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "projectId":"${{ github.event.inputs.project_id }}",
              "status":"completed",
              "renderId":"${{ github.run_id }}",
              "url":"${{ steps.public_url.outputs.url }}"
            }'

      - name: Done
        run: |
          echo "Render completed successfully"
